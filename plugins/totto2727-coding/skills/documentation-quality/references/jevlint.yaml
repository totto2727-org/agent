# Explicit rule sources, model and local cache policy for documentation review.
# Context paths, when supplied, are relative to this configuration file.
transport: cloudflare
model: typesafe/jev
rulePaths: [./jevlint]
context: []
cache: none
retry: 1
rules:
  documentation-consumer-contract: on
  documentation-audience-boundary: on
  documentation-actionable-example: on
  documentation-consequential-limit: on
  documentation-focused-unit: on
  documentation-reader-route: on
  documentation-visual-role: on
  documentation-ste-1-5: on
  documentation-ste-1-8: on
  documentation-ste-1-10: on
  documentation-ste-1-11: on
  documentation-ste-1-13: on
  documentation-ste-3-2: on
  documentation-ste-3-4: on
  documentation-ste-3-6: on
  documentation-ste-4-1: on
  documentation-ste-4-2: on
  documentation-ste-4-3: on
  documentation-ste-4-4: on
  documentation-ste-4-5: on
  documentation-ste-5-2: on
  documentation-ste-5-3: on
  documentation-ste-5-4: on
  documentation-ste-5-5: on
  documentation-ste-6-1: on
  documentation-ste-6-2: on
  documentation-ste-6-4: on
  documentation-ste-6-5: on
  documentation-ste-7-1: on
  documentation-ste-7-2: on
  documentation-ste-7-3: on
  documentation-ste-8-2: on
  documentation-ste-8-3: on
  documentation-ste-9-4: on
